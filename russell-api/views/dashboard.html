<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord</title>
</head>
<body>
    <h1>Tableau de bord</h1>
    <button id="logout">Déconnecxion</button>
    <h2>Catways</h2>
    <form id="catwayForm">
        <input type="number" id="cNumber" placeholder="Numero" required>
        <select id="cType">
            <option value="long">long</option>
            <option value="short">short</option>
        </select>
        <input id="cState" placeholder="Etat" required>
        <button>Ajouter</button>
    </form>
    <p id="msg"></p>
    <ul id="catways"></ul>
    <h2>Réservations</h2>
    <input type="number" id="rCatway" placeholder="N° du catway">
    <button id="rLoad">Voir</button>
    <form id="resForm">
        <input id="rClient" placeholder="Client" required>
        <input id="rBoat" placeholder="Bateau" required>
        <input type="date" id="rStart" required>
        <input type="date" id="rEnd" required>
        <button>Réserver</button>
    </form>
    <p id="rMsg"></p>
    <ul id="reservations"></ul>
    <h2>Utilisateurs</h2>
    <form id="yserForm">
        <input id="uName" placeholder="Nom d'utilisateur" required>
        <input type="email" id="uEmail" placeholder="Email" required>
        <input type="password" id="uPass" placeholder="Mot de passe (8 car.min.)" required>
        <button>Créer</button>
    </form>
    <p id="uMsg"></p>
    <ul id="users"></ul>

    <script>
        const headers = { 'Content-type': 'application/json' };

        document.getElementById('logout').addEventListener('click', async () => {
            await fetch('/logout');
            location.href = '/';
        });

        async function loadCatways() {
            const res = await fetch('/catways');
            if (res.status === 401) return (location.href = '/');
            const list = await res.json();
            const ul = document.getElementById('catways');
            ul.innerHTML = '';

            list.forEach(c => {
                const li = document.createElement('li');
                li.textContent = 'n°${c.catwayNumber} - ${c.catwayType} - ${c.catwayState}';
                const edit = document.createElement('button');
                edit.textContent = "Modifier l'état";
                edit.onclick = async () => {
                    const state = prompt('Nouvel état', c.catwayState);
                    if (!state) return;
                    await fetch('/catways/${ C.catwayNumber}', {
                        method: 'PUT', headers,
                        body: JSON.stringify({ catwayState: state })
                    });
                    loadCatways();
                };

                const del = document.createElement('button');
                del.textContent = 'Supprimer';
                del.onclick = async () => {
                    if (!confirm('Supprimer le catway ${c.catwayNumber} ?')) return;
                    await fetch('/catways/${c.catwayNumber}', { method: 'DELETE' });
                    loadCatways();
                };

                li.append(edit, del);
                ul.appendChild(li);
            });
        }

        document.getElementById('catwayForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/catways', {
                method: 'POST', headers,
                body: JSON.stringify({
                    catwayNumber: Number(document.getElementById('cNumber').value),
                    catwayType: document.getElementById('cType').value,
                    catwayState: document.getElementById('cState').value
                })
            });
            const data = await res.json();
            document.getElementById('msg').textContent = res.ok ? 'Catway ajouté' : data.message;
            if (res.ok) e.target.reset();
            loadCatways();
        });
        async function loadReservations() {
            const n = document.getElementById('rCatway').value;
            if (!n) return;
            const res = await fetch(`/catways/${n}/reservations`);
            if (res.status === 401) return (location.href = '/');
            const list = await res.json();
            const ul = document.getElementById('reservations');
            ul.innerHTML = '';

            list.forEach(r => {
                const li = document.createElement('li');
                li.textContent = `${r.clientName} - ${r.boatName} - ${r.startDate.slice(0, 10)} -> ${r.endDate.slice(0, 10)} `;

                const edit = document.createElement('button');
                edit.textContent = 'Changer le bateau';
                edit.onclick = async () => {
                    const boat = prompt('Nom du bateau', r.boatName);
                    if (!boat) return;
                    await fetch(`/catways/${n}/reservations/${r._id}`, {
                        method: 'PUT', headers,
                        body: JSON.stringify({ boatName: boat })
                    });
                    loadReservations();
                };

                const del = document.createElement('button');
                del.textContent = 'Supprimer';
                del.onclick = async () => {
                    if (!confirm('Supprimer cette réservation ?')) return;
                    await fetch(`/catways/${n}/reservations/${r._id}`, { method: 'DELETE' });
                    loadReservations();
                };
                li.append(edit, del);
                ul.appendChild(li);
            });
        }

        document.getElementById('rLoad').addEventListener('click', loadReservations);

        document.getElementById('resForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const n = document.getElementById('rCatway').value;
            if (!n) return (document.getElementById('rMsg').textContent = 'Indique le n° du catway');
            const res = await fetch('/catways/${n}/reservations', {
                method: 'POST', headers,
                body: JSON.stringify({
                    clientName: document.getElementById('rClient').value,
                    boatName: document.getElementById('rBoat').value,
                    startDate: document.getElementById('rStart').value,
                    endDate: document.getElementById('rEnd').value
                })
            });
            const data = await res.json();
            document.getElementById('rMsg').textContent = res.ok ? 'Réservation créée' : data.message;
            if (res.ok) e.target.reset();
            loadReservations();
        });
        async function loadUsers() {
            const res = await fetch('/users');
            if (res.status === 401) return (location.href = '/');
            const list = await res.json();
            const ul = document.getElementById('users');
            ul.innerHTML = '';

            list.forEach(u => {
                const li = document.createElement('li');
                li.textContent = `${u.username} - ${u.email}`;
                const url = `/users/${encodeURIComponent(u.email)}`;

                const edit = document.createElement('button');
                edit.textContent = 'Modifier';
                edit.onclick = async () => {
                    const username = prompt("Nom d'utilisateur", u.username);
                    if (!username) return;
                    const password = prompt('Nouveau mot de passe(laisser vide pour ne pas changer)');
                    const body = { username };
                    if (password) body.password = password;
                    const res = await fetch(url, {
                        method: 'PUT', headers,
                        body: Json.stringify(body)
                    });
                    if (!res.ok) alert((await res.json()).message);
                    loadUsers();
                };

                const del = document.createElement('button');
                del.textContent = 'Supprimer';
                del.onclick = async () => {
                    if (!confirm(`Supprimer ${u.email} ?`)) return;
                    await fetch(url, { method: 'DELETE' });
                    loadUsers();
                };

                li.append(edit, del);
                ul.appendChild(li);
            });
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/users', {
                method: 'POST', headers,
                body: JSON.stringify({
                    username: document.getElementById('uName').value,
                    email: document.getElementById('uEmail').value,
                    password: document.getElementById('uPass').value
                })
            });
            const data = await res.json();
            document.getElementById('uMsg').textContent = res.ok ? 'Utilisateur créé' : data.message;
            if (res.ok) e.target.reset();
            loadUsers();
        });

        loadCatways();
        loadUsers();
    </script>
</body>
</html>
